services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${ODOO_PORT:-18069}:80"
    volumes:
      - ./config/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      # Only substitute this one var — leave nginx's own $host/$scheme/etc alone.
      - NGINX_ENVSUBST_FILTER=^NGINX_RESOLVER$
      # Docker Compose's embedded DNS (127.0.0.11) by default; override in .env
      # with Podman's network gateway IP (`podman network inspect <network>`)
      # for Podman-based environments (e.g. local dev on this machine).
      - NGINX_RESOLVER=${NGINX_RESOLVER:-127.0.0.11}
    depends_on:
      - web
    networks:
      - odoo_app

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${ODOO_LONGPOLLING_PORT:-18072}:8072"
    volumes:
      # Dev: bind-mount source code for live editing
      - ./addons:/mnt/extra-addons/addons:ro
      - ./third-party:/mnt/extra-addons/third-party:ro
      - ./config/odoo.conf:/etc/odoo/odoo.conf
      # Persistent filestore
      - odoo-filestore:/var/lib/odoo
    environment:
      - USER=${POSTGRES_USER:-odoo}
      - PASSWORD=${POSTGRES_PASSWORD:-odoo}
      # Cloudflare R2 (read by ttm_storage_r2's post_init_hook) — podman-compose
      # doesn't reliably honor env_file, so pass explicitly via substitution.
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_BASE_URL=${R2_BASE_URL:-}
      - R2_SET_AS_DEFAULT=${R2_SET_AS_DEFAULT:-false}
      # Email (read by ttm_email's post_init_hook)
      - EMAIL_SMTP_NAME=${EMAIL_SMTP_NAME:-}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST:-}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_SMTP_USER=${EMAIL_SMTP_USER:-}
      - EMAIL_SMTP_PASS=${EMAIL_SMTP_PASS:-}
      - EMAIL_SMTP_ENCRYPTION=${EMAIL_SMTP_ENCRYPTION:-starttls_strict}
      - EMAIL_SMTP_AUTHENTICATION=${EMAIL_SMTP_AUTHENTICATION:-login}
      - EMAIL_SMTP_PRIORITY=${EMAIL_SMTP_PRIORITY:-10}
      - EMAIL_SMTP_TEST_CONNECTION=${EMAIL_SMTP_TEST_CONNECTION:-true}
      - EMAIL_FETCH_NAME=${EMAIL_FETCH_NAME:-}
      - EMAIL_FETCH_TYPE=${EMAIL_FETCH_TYPE:-imap}
      - EMAIL_FETCH_SERVER=${EMAIL_FETCH_SERVER:-}
      - EMAIL_FETCH_PORT=${EMAIL_FETCH_PORT:-993}
      - EMAIL_FETCH_SSL=${EMAIL_FETCH_SSL:-true}
      - EMAIL_FETCH_USER=${EMAIL_FETCH_USER:-}
      - EMAIL_FETCH_PASSWORD=${EMAIL_FETCH_PASSWORD:-}
      - EMAIL_FETCH_PRIORITY=${EMAIL_FETCH_PRIORITY:-5}
      - EMAIL_FETCH_CONFIRM=${EMAIL_FETCH_CONFIRM:-true}
    command: >
      bash -c "wait-for-psql.py --db_host db --db_port 5432 --db_user $${USER} --db_password $${PASSWORD} --timeout=30 &&
      exec odoo --db_host db --db_port 5432 --db_user $${USER} --db_password $${PASSWORD}"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - odoo_app

  db:
    image: postgres:17
    # Port 5432 NOT exposed externally — only accessible inside Docker network
    # ports:
    #   - "${POSTGRES_PORT:-15432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-odoo}
      - POSTGRES_DB=${POSTGRES_DB:-teguhteja-odoo-dev}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - odoo_app

# Nginx Proxy Manager
  npm:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"    # HTTP
      - "443:443"  # HTTPS
      - "81:81"    # Web UI NPM
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - odoo_app

  adminer:
    image: adminer
    # Port not exposed externally — access via SSH tunnel only
    # ports:
    #   - "${ADMINER_PORT:-18070}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - odoo_app

networks:
  odoo_app:
    name: odoo_app
    driver: bridge

volumes:
  odoo-filestore:
  postgres-data:
  npm_data:
  npm_letsencrypt:
