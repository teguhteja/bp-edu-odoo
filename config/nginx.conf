# Teruskan X-Forwarded-Proto dari upstream (NPM/Cloudflare).
# Nginx ini ada di belakang NPM, jadi $scheme selalu "http" (koneksi internal).
# Kalau tidak ada header upstream, fallback ke $scheme.
map $http_x_forwarded_proto $real_proto {
    default  $scheme;
    "https"  "https";
    "http"   "http";
}

server {
    listen 80;

    # Docker's embedded DNS resolver — re-resolve every 30s
    # Prevents 502 after container restarts (avoids stale IP cache)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Default is 1MB — too small for document uploads (Pedoman Akademik, Buku
    # Kurikulum, dll via Dokumen Master). Raise to allow larger file uploads.
    client_max_body_size 10M;

    location /websocket {
        set $odoo_upstream http://web:8072;
        proxy_pass $odoo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        set $odoo_upstream http://web:8069;
        proxy_pass $odoo_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
